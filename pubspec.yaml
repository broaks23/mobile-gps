name: ridgewalk
description: Offline-first hiking and 3D terrain explorer.
publish_to: none
version: 0.4.1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  webview_flutter: ^4.14.1
  geolocator: ^14.1.2
  sensors_plus: ^7.1.1
  path_provider: ^2.1.5
  archive: ^4.6.0
  crypto: ^3.0.8
  file_picker: ^13.3.3
  sqlite3: ^3.9.1

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/renderer/
    - assets/renderer/assets/
    - assets/renderer/licenses/
    - samples/bucegi/

