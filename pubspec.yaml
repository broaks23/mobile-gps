name: ridgewalk
description: Offline-first hiking and 3D terrain explorer.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  webview_flutter: ^4.14.1
  geolocator: ^14.1.2
  sensors_plus: ^7.1.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/renderer/
    - assets/renderer/assets/
    - assets/renderer/licenses/

